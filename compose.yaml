services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: final_review
      POSTGRES_USER: final_review
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
  agent:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://final_review:${POSTGRES_PASSWORD}@postgres:5432/final_review
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_started
    restart: on-failure:3
volumes:
  postgres-data:
